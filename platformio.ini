; PlatformIO Project Configuration File
; ESP32-S3 TFT Touch Desk Lamp Project

[platformio]
default_envs = lolin_s3_mini

[env:lolin_s3_mini]
platform = espressif32 @ 6.6.0
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.arduino.memory_type = qio_qspi
upload_port = /dev/cu.usbmodem2101
monitor_port = /dev/cu.usbmodem2101
build_unflags = -Os
build_flags = 
    -O3
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=13
    -D TFT_MOSI=9
    -D TFT_SCLK=10
    -D TFT_CS=6
    -D TFT_DC=7
    -D TFT_RST=8
    -D TFT_BL=5
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    fbiego/CST816S @ ^1.1.1
    knolleary/PubSubClient @ 2.8
    bblanchon/ArduinoJson @ ^6.21.3
extra_scripts = pre:load_env.py

[env:lolin_s3_mini_ota]
extends = env:lolin_s3_mini
upload_protocol = espota
upload_port = 192.168.68.51

[env:esp32-c3-devkitm-1]
platform = espressif32 @ 6.6.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=0
    -D TFT_MOSI=9
    -D TFT_SCLK=10
    -D TFT_CS=6
    -D TFT_DC=7
    -D TFT_RST=8
    -D TFT_BL=5
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    fbiego/CST816S @ ^1.1.1
    knolleary/PubSubClient @ 2.8
    bblanchon/ArduinoJson @ ^6.21.3
extra_scripts = pre:load_env.py

[env:esp32-c3-devkitm-1_ota]
extends = env:esp32-c3-devkitm-1
upload_protocol = espota
upload_port = 192.168.68.51
